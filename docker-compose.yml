services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: abank
      POSTGRES_USER: abank
      POSTGRES_PASSWORD: abank123
    ports:
      - "5432:5432"
    volumes:
      # postgres corre estos scripts en orden la primera vez que se crea el volumen
      - ./BaseDeDatos:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abank -d abank"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./Backend
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=abank;Username=abank;Password=abank123"
      Jwt__Key: "${JWT_KEY:-llave-de-prueba-para-docker-compose-cambiar-en-prod}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
